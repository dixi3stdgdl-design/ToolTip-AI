name: Build ToolTip AI macOS Suite

on:
  push:
    branches: [ main ]
    paths:
      - 'macos/**'
      - '.github/workflows/build-macos.yml'
  workflow_dispatch:

jobs:
  build:
    name: Compile & Package Complete macOS Suite
    runs-on: macos-14

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Show macOS and Swift Tools
        run: |
          sw_vers
          swift --version
          xcodebuild -version

      - name: Build All 6 Suite Targets (Release)
        working-directory: macos
        run: |
          swift build -c release

      - name: Assemble macOS App Bundles
        working-directory: macos
        run: |
          APPS=("ToolTipDashboard" "ToolTipAssistant" "ToolTipTranslate" "ToolTipAura" "ToolTipVoice" "ToolTipBridge")

          for APP in "${APPS[@]}"; do
            echo "Assembler: Empaquetando $APP.app..."
            mkdir -p "$APP.app/Contents/MacOS"
            mkdir -p "$APP.app/Contents/Resources"
            cp ".build/release/$APP" "$APP.app/Contents/MacOS/$APP"
            chmod +x "$APP.app/Contents/MacOS/$APP"
            cp "Plists/$APP-Info.plist" "$APP.app/Contents/Info.plist"
          done

          # Embed Helpers inside ToolTipDashboard for Route 1 (Unified Container App)
          mkdir -p "ToolTipDashboard.app/Contents/Helpers"
          cp -R "ToolTipAssistant.app" "ToolTipDashboard.app/Contents/Helpers/"
          cp -R "ToolTipTranslate.app" "ToolTipDashboard.app/Contents/Helpers/"
          cp -R "ToolTipAura.app" "ToolTipDashboard.app/Contents/Helpers/"
          cp -R "ToolTipVoice.app" "ToolTipDashboard.app/Contents/Helpers/"
          cp -R "ToolTipBridge.app" "ToolTipDashboard.app/Contents/Helpers/"

          # Empaquetar la suite completa con preservación de metadata
          mkdir -p dist
          cp -R ToolTipDashboard.app dist/
          cp -R ToolTipAssistant.app dist/
          cp -R ToolTipTranslate.app dist/
          cp -R ToolTipAura.app dist/
          cp -R ToolTipVoice.app dist/
          cp -R ToolTipBridge.app dist/

          ditto -c -k --keepParent dist ToolTipAI-macOS-Complete-Suite.zip

      - name: Upload Suite Build Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ToolTipAI-macOS-Complete-Suite
          path: macos/ToolTipAI-macOS-Complete-Suite.zip
          retention-days: 14
