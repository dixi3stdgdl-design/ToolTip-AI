<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <style>
    body {
      width: 320px;
      margin: 0;
      padding: 16px;
      background: #070d18;
      color: #f8fafc;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }
    .header {
      display: flex;
      align-items: center;
      gap: 8px;
      border-bottom: 1px solid #1e293b;
      padding-bottom: 12px;
      margin-bottom: 14px;
    }
    .dot { width: 10px; height: 10px; border-radius: 50%; background: #a855f7; box-shadow: 0 0 8px #a855f7; }
    h1 { font-size: 14px; margin: 0; font-weight: 700; }
    .badge { font-size: 10px; background: #1e293b; color: #c084fc; padding: 2px 6px; border-radius: 4px; margin-left: auto; }
    .stat-box { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-bottom: 14px; }
    .card { background: #0f172a; border: 1px solid #334155; padding: 8px; border-radius: 8px; text-align: center; }
    .num { font-size: 18px; font-weight: 700; color: #38bdf8; }
    .lbl { font-size: 10px; color: #94a3b8; margin-top: 2px; }
    .setting-row { display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px; font-size: 12px; }
    .btn { display: block; width: 100%; box-sizing: border-box; text-align: center; background: linear-gradient(135deg, #9333ea, #7e22ce); color: #fff; text-decoration: none; padding: 8px; border-radius: 6px; font-size: 12px; font-weight: 600; margin-top: 14px; border: none; cursor: pointer; }
    .footer { font-size: 10px; color: #64748b; text-align: center; margin-top: 12px; }
  </style>
  <!-- Google tag (gtag.js) -->
  <script async src="https://www.googletagmanager.com/gtag/js?id=G-WSGPY3DK4Z"></script>
  <script>
    window.dataLayer = window.dataLayer || [];
    function gtag(){dataLayer.push(arguments);}
    gtag('js', new Date());

    gtag('config', 'G-WSGPY3DK4Z');
  </script>
  <!-- Microsoft Clarity -->
  <script type="text/javascript">
    (function(c,l,a,r,i,t,y){
      c[a]=c[a]||function(){(c[a].q=c[a].q||[]).push(arguments)};
      t=l.createElement(r);t.async=1;t.src="https://www.clarity.ms/tag/"+i;
      y=l.getElementsByTagName(r)[0];y.parentNode.insertBefore(t,y);
    })(window, document, "clarity", "script", "yx9lgph0yh");
  </script>
</head>
<body>
  <div class="header">
    <div class="dot"></div>
    <h1>TOOLTIP AURA</h1>
    <span class="badge">v1.0.2</span>
  </div>
  <div class="stat-box">
    <div class="card">
      <div class="num" id="dwellTime">450ms</div>
      <div class="lbl">Tiempo de Dwell</div>
    </div>
    <div class="card">
      <div class="num" id="shieldStatus" style="color: #10b981;">ACTIVO</div>
      <div class="lbl">Escudo Cognitivo</div>
    </div>
  </div>
  <div class="setting-row">
    <span>Radar de Dwell Visual:</span>
    <input type="checkbox" id="auraRadar" checked>
  </div>
  <div class="setting-row">
    <span>Inspección de Enlaces Peligrosos:</span>
    <input type="checkbox" id="linkShield" checked>
  </div>
  <button class="btn" id="btnPing">Emitir Pulso Sonar en Página</button>
  <div class="footer">Ecosistema ToolTip AI · dixi3stdgdl-design</div>
</body>
</html>
