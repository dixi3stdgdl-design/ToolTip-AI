<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <style>
    body {
      width: 320px;
      margin: 0;
      padding: 16px;
      background: #070d18;
      color: #f8fafc;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }
    .header {
      display: flex;
      align-items: center;
      gap: 8px;
      border-bottom: 1px solid #1e293b;
      padding-bottom: 12px;
      margin-bottom: 14px;
    }
    .dot { width: 10px; height: 10px; border-radius: 50%; background: #00e5ff; box-shadow: 0 0 8px #00e5ff; }
    h1 { font-size: 14px; margin: 0; font-weight: 700; }
    .badge { font-size: 10px; background: #1e293b; color: #38bdf8; padding: 2px 6px; border-radius: 4px; margin-left: auto; }
    .setting-row { display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px; font-size: 12px; }
    select, input[type="range"] { background: #0f172a; color: #38bdf8; border: 1px solid #334155; border-radius: 6px; }
    select { padding: 5px 8px; outline: none; }
    .btn-group { display: flex; gap: 8px; margin-top: 14px; }
    .btn { flex: 1; text-align: center; background: #1e293b; color: #38bdf8; border: 1px solid #334155; padding: 8px; border-radius: 6px; font-size: 11px; font-weight: 600; cursor: pointer; }
    .btn-primary { background: linear-gradient(135deg, #0284c7, #0369a1); color: #fff; border: none; }
    .btn:hover { filter: brightness(1.1); }
    .footer { font-size: 10px; color: #64748b; text-align: center; margin-top: 12px; }
  </style>
  <!-- Google tag (gtag.js) -->
  <script async src="https://www.googletagmanager.com/gtag/js?id=G-WSGPY3DK4Z"></script>
  <script>
    window.dataLayer = window.dataLayer || [];
    function gtag(){dataLayer.push(arguments);}
    gtag('js', new Date());

    gtag('config', 'G-WSGPY3DK4Z');
  </script>
  <!-- Microsoft Clarity -->
  <script type="text/javascript">
    (function(c,l,a,r,i,t,y){
      c[a]=c[a]||function(){(c[a].q=c[a].q||[]).push(arguments)};
      t=l.createElement(r);t.async=1;t.src="https://www.clarity.ms/tag/"+i;
      y=l.getElementsByTagName(r)[0];y.parentNode.insertBefore(t,y);
    })(window, document, "clarity", "script", "yx9lgph0yh");
  </script>
</head>
<body>
  <div class="header">
    <div class="dot"></div>
    <h1>TOOLTIP VOICE</h1>
    <span class="badge">WASAPI Core</span>
  </div>
  <div class="setting-row">
    <span>Velocidad de Lectura:</span>
    <input type="range" id="voiceRate" min="0.5" max="1.8" step="0.1" value="1.0">
  </div>
  <div class="setting-row">
    <span>Volumen:</span>
    <input type="range" id="voiceVol" min="0" max="1" step="0.1" value="0.9">
  </div>
  <div class="setting-row">
    <span>Botón Flotante en Selección:</span>
    <input type="checkbox" id="selectionButton" checked>
  </div>
  <div class="btn-group">
    <button class="btn btn-primary" id="btnSpeak">Leer Selección</button>
    <button class="btn" id="btnStop" style="color: #f43f5e;">Detener</button>
  </div>
  <div class="footer">Ecosistema ToolTip AI · dixi3stdgdl-design</div>
</body>
</html>
